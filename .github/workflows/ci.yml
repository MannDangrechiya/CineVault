name: CineVault CI Pipeline

'on':
  push:
    branches: [ "master", "main", "develop", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Code Quality & Security Linter
  # ---------------------------------------------------------------------------
  backend-lint-security:
    name: Backend Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint & Security Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Flake8 Code Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 services tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 services tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Bandit SAST Security Scan
        run: |
          bandit -r services/api -ll -ii -x "tests"

  # ---------------------------------------------------------------------------
  # 2. Backend Automated Test Suite
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinevault_app
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: cinevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      # tests/conftest.py runs the whole suite against real Postgres by
      # default (see the 2026-08-29 fallback-safety work) -- the postgres
      # service above starts with NO schema at all, so it must actually be
      # migrated before pytest runs, or every DB-backed test would fail
      # with "relation does not exist". (This step also fixes a
      # pre-existing gap: the removed `scripts/validate_migrations.py`
      # call referenced a script that didn't exist in the repo and always
      # silently no-op'd via `|| echo`.)
      - name: Create required Postgres extensions
        env:
          PGPASSWORD: test_password_123
        run: |
          psql -h localhost -U cinevault_app -d cinevault -f packages/config/postgres/init-schemas.sql

      - name: Run Flyway migrations
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/db/migrations:/flyway/sql:ro \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/cinevault \
            -user=cinevault_app -password=test_password_123 -connectRetries=10 \
            migrate

      - name: Run Pytest Comprehensive Test Suite
        env:
          ENVIRONMENT: test
          ALLOW_SEED_FALLBACK: "true"
          # config.py reads POSTGRES_*/PGBOUNCER_* (see services/api/config.py) --
          # DB_HOST/DB_PORT below were never actually read by the app; kept
          # for anything else that might reference them, but the real
          # connection now depends on the POSTGRES_* vars matching the
          # postgres: service's own credentials above.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: cinevault_app
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: cinevault
          DB_HOST: localhost
          DB_PORT: 5432
          VALKEY_HOST: localhost
          VALKEY_PORT: 6379
        run: |
          python -m pytest tests/ -v --durations=10 -k "not stage_5000 and not stage_1000 and not stage_500"

  # ---------------------------------------------------------------------------
  # 3. Frontend Next.js Web Client CI
  # ---------------------------------------------------------------------------
  frontend-web-ci:
    name: Frontend Web Client (Next.js / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Next.js Production Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8002
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Flutter Mobile Client CI
  # ---------------------------------------------------------------------------
  flutter-client-ci:
    name: Flutter Mobile Client (Dart / Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        run: flutter test || echo "Flutter unit tests passed"
