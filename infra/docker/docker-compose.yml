# CineVault OS — Local Development Infrastructure Stack (Phase 0)
# LOCAL DEVELOPMENT ONLY. DO NOT USE IN PRODUCTION.

version: '3.8'

services:
  # 1. Database: PostgreSQL 16 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinevault-local-postgres
    # Docker Desktop's WSL2 backend on this machine has been observed sending
    # an unexplained "fast shutdown request" to this container (confirmed via
    # `docker logs` — not an application crash). restart: unless-stopped
    # brings it back automatically instead of leaving the API silently
    # falling back to seed data until someone notices. See
    # WEB_FEATURE_AUDIT.md "Known infra flakiness" for the full writeup and
    # the accompanying .wslconfig memory/swap tuning.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinevault}
      POSTGRES_USER: ${POSTGRES_USER:-cinevault_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - ../../packages/config/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinevault_dev} -d ${POSTGRES_DB:-cinevault}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1b. Migration Engine: Flyway Community Edition
  # Local dev only: loads db/migrations (versioned, shared with prod) PLUS
  # db/dev-seed (repeatable synthetic seed data, dev-only — see
  # db/dev-seed/R__seed_development_taxonomy.sql). docker-compose.prod.yml
  # deliberately does NOT mount db/dev-seed, so the seed migration never runs
  # in production. Do not add a db/dev-seed mount/location to any prod config.
  flyway:
    image: flyway/flyway:10-alpine
    container_name: cinevault-local-flyway
    command: -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cinevault} -user=${POSTGRES_USER:-cinevault_dev} -password=${POSTGRES_PASSWORD:-dev_postgres_password_change_me} -connectRetries=10 -locations=filesystem:/flyway/sql,filesystem:/flyway/dev-seed migrate
    volumes:
      - ../../db/migrations:/flyway/sql:ro
      - ../../db/dev-seed:/flyway/dev-seed:ro
    depends_on:
      postgres:
        condition: service_healthy

  # 2. Connection Pooler: PgBouncer
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: cinevault-local-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cinevault}
      DB_USER: ${POSTGRES_USER:-cinevault_dev}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_password_change_me}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      # Without this, the image defaults to listening on 5432 internally,
      # which doesn't match the 6432:6432 port mapping below (nothing reachable on 6432).
      LISTEN_PORT: 6432
      # Postgres 16 defaults to scram-sha-256 password encryption; PgBouncer's
      # own default auth_type (md5) then fails backend auth with "wrong password type".
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Cache: Valkey (Linux Foundation RESP)
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: cinevault-local-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Queue Broker: RabbitMQ (AMQP 0-9-1 / Management UI)
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: cinevault-local-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cinevault_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dev_rabbitmq_password_change_me}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Identity: Keycloak Server (OIDC)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: cinevault-local-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev_keycloak_admin_password_change_me}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ../../packages/config/keycloak/cinevault-realm-dev.json:/opt/keycloak/data/import/cinevault-realm-dev.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  # 5b. Local SMTP Sink: MailHog (P0 fix — Day 1-7 remediation)
  # Keycloak's "Forgot password" flow needs an SMTP relay to send reset
  # emails. MailHog accepts all mail on :1025 with no auth and exposes a
  # web UI on :8025 to read what was "sent" — no real mail delivery, no
  # external SMTP account needed for local development.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cinevault-local-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # 6. API Gateway: Kong Gateway (DB-Less)
  kong:
    image: kong:3.6
    container_name: cinevault-local-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ../../packages/config/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro

  # 7. Telemetry: OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cinevault-local-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../../packages/config/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter

  # 8. Observability: Prometheus
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cinevault-local-prometheus
    volumes:
      - ../../packages/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # 9. Log Aggregation: Grafana Loki
  loki:
    image: grafana/loki:3.0.0
    container_name: cinevault-local-loki
    volumes:
      - ../../packages/config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  # 10. Dashboard Visualizer: Grafana
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cinevault-local-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # 11. Object Storage: MinIO (S3 Parity for local dev)
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: cinevault-local-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dev_s3_access_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dev_s3_secret_key}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  prometheus-data:
  minio-data:
