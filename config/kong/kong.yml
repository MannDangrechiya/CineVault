_format_version: "3.0"
_transform: true

services:
  - name: cinevault-public-api
    url: http://host.docker.internal:8000/v1
    routes:
      - name: public-api-route
        paths:
          - /v1
        strip_path: false
    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Correlation-ID:018f2e4a-7b31-7000-8000-000000000000"
      - name: rate-limiting
        config:
          minute: 600
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-Correlation-ID
            - X-Idempotency-Key
          credentials: true
          max_age: 3600

  - name: cinevault-internal-api
    url: http://host.docker.internal:8000/internal/v1
    routes:
      - name: internal-api-route
        paths:
          - /internal/v1
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 1200
          policy: local

  - name: cinevault-health-api
    url: http://host.docker.internal:8000/health
    routes:
      - name: health-api-route
        paths:
          - /health
        strip_path: false
