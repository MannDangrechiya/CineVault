receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_all_patterns(attributes, "value", "email=.*", "email=[REDACTED_CAT2]")
          - replace_all_patterns(attributes, "value", "authorization=.*", "authorization=[REDACTED_SECRET]")

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  # P1 fix (Day 1-7 remediation): the 'logging' exporter was removed from
  # otel-collector-contrib and replaced by 'debug'. The old name caused the
  # collector to fail config validation and exit(1) on every start.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [debug]
